name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE_PATH: /
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar o Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Gerar o site estático
        run: bun run build

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Desativar o processamento Jekyll
        run: touch dist/client/.nojekyll

      - name: Enviar os arquivos gerados
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
